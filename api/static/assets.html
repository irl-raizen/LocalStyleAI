<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Library - LocalStyleAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        a.nav-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-left: 1rem;
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-bar input, .search-bar select {
            padding: 0.75rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
        }

        .search-bar input {
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .asset-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }

        .asset-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
            color: #fff;
        }
        
        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .asset-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .btn-delete {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger-hover);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 1rem;
            font-style: italic;
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            background: var(--card-bg);
            border-radius: 12px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Asset Studio</h1>
            <div>
                <a href="/training_ui" class="nav-link">Training Dashboard &rarr;</a>
                <a href="/" class="nav-link">Generator &rarr;</a>
            </div>
        </div>
        
        <div class="search-bar">
            <input type="text" id="search-query" placeholder="Search assets by name or tags..." onkeyup="if(event.key === 'Enter') loadAssets()">
            <select id="search-type" onchange="loadAssets()">
                <option value="">All Types</option>
                <option value="character">Character</option>
                <option value="style">Style</option>
                <option value="product">Product</option>
                <option value="environment">Environment</option>
                <option value="object">Object</option>
            </select>
            <button onclick="loadAssets()" style="padding: 0.75rem 1.5rem; background: var(--primary-color); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600;">Search</button>
        </div>

        <div id="assets-grid" class="grid">
            <div class="empty-state">Loading assets...</div>
        </div>
    </div>

    <script>
        async function loadAssets() {
            const query = document.getElementById('search-query').value;
            const type = document.getElementById('search-type').value;
            const grid = document.getElementById('assets-grid');
            
            grid.innerHTML = '<div class="empty-state">Loading...</div>';

            try {
                const formData = new FormData();
                if (query) formData.append("query", query);
                if (type) formData.append("asset_type", type);
                
                const res = await fetch('/assets/search', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                grid.innerHTML = '';
                
                if (!data.results || data.results.length === 0) {
                    grid.innerHTML = '<div class="empty-state">No assets found. Go to the Training Dashboard to create one!</div>';
                    return;
                }

                data.results.forEach(asset => {
                    const card = document.createElement('div');
                    card.className = 'asset-card';
                    card.innerHTML = `
                        <div class="asset-title">${asset.name} <span style="font-size: 0.9rem; color: var(--text-muted)">${asset.version}</span></div>
                        <div class="badge">${asset.asset_type.toUpperCase()}</div>
                        <button class="btn-delete" onclick="deleteAsset('${asset.asset_id}')">Delete</button>
                        <div class="asset-details"><b>Score:</b> ${Math.round(asset.score * 100)}%</div>
                        <div class="asset-details"><b>Created:</b> ${new Date(asset.created_at).toLocaleDateString()}</div>
                        ${asset.tags.length > 0 ? `<div class="asset-details" style="margin-top: 0.5rem; color: #818cf8;">#${asset.tags.join(' #')}</div>` : ''}
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="empty-state">Failed to load assets.</div>';
            }
        }

        async function deleteAsset(id) {
            if (!confirm(`Are you sure you want to delete this asset?`)) return;
            try {
                await fetch(`/assets/${id}`, { method: 'DELETE' });
                loadAssets();
            } catch (e) {
                alert('Failed to delete asset.');
            }
        }

        window.onload = loadAssets;
    </script>
</body>
</html>
