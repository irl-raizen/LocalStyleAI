<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStyleAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(34, 211, 238, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-color);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.3);
            position: relative;
            overflow: hidden;
        }

        .result-area img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        .placeholder {
            color: var(--text-muted);
            text-align: center;
        }

        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card input-section">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h1>LocalStyleAI</h1>
                <a href="/memory" style="color: var(--primary-color); text-decoration: none; font-weight: 600; font-size: 0.9rem;">Memory Manager &rarr;</a>
            </div>
            <p class="subtitle">Generate stunning images locally with custom styles.</p>
            <p id="model-status" style="color: var(--primary-color); font-weight: 600; font-size: 0.85rem; margin-top: -1.5rem; margin-bottom: 2rem;">Current Model: Loading...</p>

            <div class="form-group">
                <label for="prompt">Prompt</label>
                <input type="text" id="prompt" placeholder="Describe your imagination..."
                    value="A futuristic cyberpunk city with neon lights">
            </div>

            <div class="form-group">
                <label for="style">Style</label>
                <select id="style">
                    <option value="default">Default (Stable Diffusion)</option>
                    <option value="ghibli_clean">Studio Ghibli</option>
                    <option value="lineart_clean">Line Art</option>
                    <option value="anime_clean">Anime</option>
                </select>
            </div>

            <button onclick="generate()" id="gen-btn">
                Generate Image
            </button>
        </div>

        <div class="card result-section">
            <div class="result-area" id="result-area">
                <div class="placeholder" id="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        style="margin-bottom: 1rem; opacity: 0.5;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>Your generated art will appear here</p>
                </div>
                <div class="loading-spinner" id="loading"></div>
            </div>
        </div>
    </div>

    <script>
        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const style = document.getElementById('style').value;
            const btn = document.getElementById('gen-btn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('result-area');
            const placeholder = document.getElementById('placeholder');

            // Reset UI
            const existingImg = resultArea.querySelector('img');
            if (existingImg) existingImg.remove();
            const existingError = resultArea.querySelector('.error-msg');
            if (existingError) existingError.remove();

            btn.disabled = true;
            btn.innerText = 'Generating...';
            placeholder.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('prompt', prompt);
            formData.append('style', style);

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = "Generated Image";
                    resultArea.appendChild(img);
                } else {
                    showError(`Error: ${response.statusText}`);
                }
            } catch (e) {
                showError(`Error: ${e.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Image';
                loading.style.display = 'none';
            }
        }

        function showError(msg) {
            const resultArea = document.getElementById('result-area');
            const p = document.createElement('p');
            p.className = 'error-msg';
            p.style.color = '#ef4444';
            p.innerText = msg;
            resultArea.appendChild(p);
        }

        async function fetchModelStatus() {
            try {
                const response = await fetch('/debug/model');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('model-status').innerText = `Current Model: ${data.active_model.toUpperCase()}`;
                } else {
                    document.getElementById('model-status').innerText = `Current Model: Unknown`;
                }
            } catch (e) {
                console.error("Could not fetch model status", e);
                document.getElementById('model-status').innerText = `Current Model: Offline`;
            }
        }

        window.onload = fetchModelStatus;
    </script>
</body>

</html>
